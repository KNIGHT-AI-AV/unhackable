ServerName unhackable
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/app/public>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    RewriteEngine On
    RewriteRule ^robots\.txt$ robots.php [L]
    RewriteRule ^favicon\.(svg|ico)$ favicon.php [L]
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

ErrorDocument 404 /404.php

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 24
</IfModule>
